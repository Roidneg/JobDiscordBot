name: Daily Job Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  collect-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Collect and post jobs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Persist seen-job state
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "job-intelligence-bot"
          git config user.email "job-intelligence-bot@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "chore: update seen job state"
          git push
